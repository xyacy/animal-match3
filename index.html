<script data-page-node-id="uTFrRpa6u9pLPErIKcXdAk" data-pnid-children="1XseMiXTV203s9Z7Kv4uAP">
/* ---------------- 小动物 SVG ---------------- */
const S = (inner)=>`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const eye=(x,y,r=5)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#33292f"/><circle cx="${x+r*0.35}" cy="${y-r*0.4}" r="${r*0.36}" fill="#fff"/>`;
const blush=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="6" ry="3.6" fill="#ff9db4" opacity=".55"/>`;

const SVG={
  panda:S(`
    <ellipse cx="27" cy="27" rx="11" ry="11" fill="#3a3340"/>
    <ellipse cx="73" cy="27" rx="11" ry="11" fill="#3a3340"/>
    <circle cx="50" cy="58" r="31" fill="#fffaf6"/>
    <ellipse cx="38" cy="55" rx="10" ry="12" fill="#3a3340" transform="rotate(-10 38 55)"/>
    <ellipse cx="62" cy="55" rx="10" ry="12" fill="#3a3340" transform="rotate(10 62 55)"/>
    ${eye(38,55,3.6)}${eye(62,55,3.6)}
    <ellipse cx="50" cy="70" rx="5.4" ry="4.2" fill="#3a3340"/>
    <path d="M44 76 q6 5 12 0" stroke="#3a3340" stroke-width="2.6" fill="none" stroke-linecap="round"/>`),
  rabbit:S(`
    <ellipse cx="35" cy="24" rx="8.5" ry="22" fill="#fffaf6" transform="rotate(-9 35 24)"/>
    <ellipse cx="65" cy="24" rx="8.5" ry="22" fill="#fffaf6" transform="rotate(9 65 24)"/>
    <ellipse cx="35" cy="25" rx="3.8" ry="14" fill="#ffc2d1" transform="rotate(-9 35 25)"/>
    <ellipse cx="65" cy="25" rx="3.8" ry="14" fill="#ffc2d1" transform="rotate(9 65 25)"/>
    <circle cx="50" cy="62" r="29" fill="#fffaf6"/>
    ${eye(39,58)}${eye(61,58)}
    <path d="M50 66 l-5.5 4.5 h11 z" fill="#ff7f9f"/>
    <path d="M50 71 v3 M50 74 q-6 4 -9 -1 M50 74 q6 4 9 -1" stroke="#d98ba2" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    ${blush(28,66)}${blush(72,66)}`),
  bear:S(`
    <circle cx="26" cy="31" r="11.5" fill="#b5793f"/><circle cx="26" cy="31" r="5" fill="#e8b98a"/>
    <circle cx="74" cy="31" r="11.5" fill="#b5793f"/><circle cx="74" cy="31" r="5" fill="#e8b98a"/>
    <circle cx="50" cy="59" r="30" fill="#c98a4b"/>
    <ellipse cx="50" cy="71" rx="15" ry="10.5" fill="#f2d3ab"/>
    ${eye(38,54)}${eye(62,54)}
    <ellipse cx="50" cy="65" rx="5.5" ry="4.4" fill="#4a3226"/>
    <path d="M50 69 v4 M43 78 q7 5 14 0" stroke="#4a3226" stroke-width="2.4" fill="none" stroke-linecap="round"/>`),
  chick:S(`
    <path d="M46 30 q-2 -14 8 -12 q-2 8 2 12 z" fill="#ffb62e"/>
    <circle cx="50" cy="59" r="30" fill="#ffd54a"/>
    ${eye(38,55)}${eye(62,55)}
    <path d="M50 63 l-9 9 h18 z" fill="#ff9f43"/>
    ${blush(28,66)}${blush(72,66)}`),
  frog:S(`
    <circle cx="31" cy="35" r="13" fill="#8ed36a"/><circle cx="31" cy="35" r="8" fill="#fff"/>
    <circle cx="31" cy="35" r="4.2" fill="#2f2a30"/>
    <circle cx="69" cy="35" r="13" fill="#8ed36a"/><circle cx="69" cy="35" r="8" fill="#fff"/>
    <circle cx="69" cy="35" r="4.2" fill="#2f2a30"/>
    <circle cx="50" cy="62" r="29" fill="#8ed36a"/>
    <path d="M32 66 q18 15 36 0" stroke="#2f7a3a" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    ${blush(26,70)}${blush(74,70)}`),
  pig:S(`
    <path d="M27 36 q-8 -16 15 -9 z" fill="#ff9db4"/>
    <path d="M73 36 q8 -16 -15 -9 z" fill="#ff9db4"/>
    <circle cx="50" cy="60" r="30" fill="#ffb8c9"/>
    ${eye(38,55)}${eye(62,55)}
    <ellipse cx="50" cy="72" rx="13" ry="9.5" fill="#ff8fae"/>
    <ellipse cx="45" cy="72" rx="2.6" ry="3.6" fill="#d9627f"/>
    <ellipse cx="55" cy="72" rx="2.6" ry="3.6" fill="#d9627f"/>
    ${blush(26,64)}${blush(74,64)}`)
};
const TYPES=['panda','rabbit','bear','chick','frog','pig'];
const TINT={panda:'#eef1f6',rabbit:'#fff0f4',bear:'#fbeee0',chick:'#fff6da',frog:'#eaf8e4',pig:'#ffeef2'};

/* ---------------- 基本状态 ---------------- */
const N=8;
const boardEl=document.getElementById('board');
let grid=[];              // grid[r][c] = tile | null
let CELL=52, BOARD=N*CELL;
let level=1, score=0, total=0, moves=30, target=1000;
let busy=false, selected=null, uid=0;
let soundOn=true, hintTimer=null, drag=null;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const inB=(r,c)=>r>=0&&r<N&&c>=0&&c<N;

/* ---------------- 音效 ---------------- */
let ac=null;
function beep(freq,dur=.09,type='sine',vol=.07){
  if(!soundOn)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);
  }catch(e){}
}

/* ---------------- 尺寸 ---------------- */
function layout(){
  const max=Math.min(document.querySelector('.wrap').clientWidth-30, 470);
  CELL=Math.max(34,Math.floor(max/N));
  BOARD=CELL*N;
  boardEl.style.width=BOARD+'px';
  boardEl.style.height=BOARD+'px';
  document.documentElement.style.setProperty('--cell',CELL+'px');
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=grid[r]&&grid[r][c];if(t)place(t);}
}
function place(t){t.el.style.transform=`translate(${t.c*CELL}px,${t.r*CELL}px)`;}

/* ---------------- 棋子 ---------------- */
function makeTile(type,r,c,startY){
  const el=document.createElement('div');
  el.className='tile';
  el.innerHTML=`<div class="face">${SVG[type]}</div><div class="badge"></div>`;
  el.style.setProperty('--tint',TINT[type]);
  const t={id:++uid,type,r,c,special:null,el};
  el.dataset.id=t.id;
  if(startY!=null){
    el.style.transition='none';
    el.style.transform=`translate(${c*CELL}px,${startY}px)`;
    el.offsetHeight;               // 强制回流
    el.style.transition='';
  }
  boardEl.appendChild(el);
  place(t);
  return t;
}
function setSpecial(t,sp){
  t.special=sp;
  t.el.classList.remove('sp','sp-bomb','sp-rainbow');
  if(sp){t.el.classList.add('sp','sp-'+sp);t.el.querySelector('.badge').textContent=sp==='bomb'?'💣':'🌈';}
}

/* ---------------- 开局 ---------------- */
function newGame(){
  boardEl.innerHTML='';
  grid=Array.from({length:N},()=>Array(N).fill(null));
  level=1;score=0;total=0;moves=30;target=1000;busy=false;selected=null;
  fillFresh();
  layout();
  updateHUD();
}
function fillFresh(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const bad=new Set();
    if(c>=2&&grid[r][c-1].type===grid[r][c-2].type)bad.add(grid[r][c-1].type);
    if(r>=2&&grid[r-1][c].type===grid[r-2][c].type)bad.add(grid[r-1][c].type);
    let pool=TYPES.filter(t=>!bad.has(t));
    grid[r][c]=makeTile(pool[rnd(pool.length)],r,c);
  }
  if(!findMove()){for(let r=0;r<N;r++)for(let c=0;c<N;c++)grid[r][c].el.remove();fillFresh();}
}

/* ---------------- 匹配 ---------------- */
function runAt(r,c){
  const t=grid[r][c];if(!t)return false;
  let n=1;
  for(let i=c-1;i>=0&&grid[r][i]&&grid[r][i].type===t.type;i--)n++;
  for(let i=c+1;i<N&&grid[r][i]&&grid[r][i].type===t.type;i++)n++;
  if(n>=3)return true;
  n=1;
  for(let i=r-1;i>=0&&grid[i][c]&&grid[i][c].type===t.type;i--)n++;
  for(let i=r+1;i<N&&grid[i][c]&&grid[i][c].type===t.type;i++)n++;
  return n>=3;
}
/** 返回合并后的连通匹配组 [{tiles:Set, rows:bool, cols:bool}] */
function findMatches(){
  const runs=[];
  for(let r=0;r<N;r++){
    let s=0;
    for(let c=1;c<=N;c++){
      const same=c<N&&grid[r][c]&&grid[r][s]&&grid[r][c].type===grid[r][s].type;
      if(!same){if(c-s>=3)runs.push({tiles:grid[r].slice(s,c),dir:'h'});s=c;}
    }
  }
  for(let c=0;c<N;c++){
    let s=0;
    for(let r=1;r<=N;r++){
      const same=r<N&&grid[r][c]&&grid[s][c]&&grid[r][c].type===grid[s][c].type;
      if(!same){if(r-s>=3){const a=[];for(let i=s;i<r;i++)a.push(grid[i][c]);runs.push({tiles:a,dir:'v'});}s=r;}
    }
  }
  if(!runs.length)return [];
  // 合并共享棋子的组
  const groups=[];
  for(const run of runs){
    const hit=groups.filter(g=>g.tiles.some(t=>run.tiles.includes(t)));
    if(!hit.length){groups.push({tiles:[...run.tiles],h:run.dir==='h',v:run.dir==='v',main:run.tiles});}
    else{
      const g=hit[0];
      for(const t of run.tiles)if(!g.tiles.includes(t))g.tiles.push(t);
      g.h=g.h||run.dir==='h';g.v=g.v||run.dir==='v';
      g.main=run.tiles.length>g.main.length?run.tiles:g.main;
      for(let i=1;i<hit.length;i++){
        const o=hit[i];
        for(const t of o.tiles)if(!g.tiles.includes(t))g.tiles.push(t);
        g.h=g.h||o.h;g.v=g.v||o.v;
        groups.splice(groups.indexOf(o),1);
      }
    }
  }
  return groups;
}
function findMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    for(const [dr,dc] of [[0,1],[1,0]]){
      const r2=r+dr,c2=c+dc;if(!inB(r2,c2))continue;
      const a=grid[r][c],b=grid[r2][c2];
      grid[r][c]=b;grid[r2][c2]=a;a.r=r2;a.c=c2;b.r=r;b.c=c;
      const ok=runAt(r,c)||runAt(r2,c2)||a.special==='rainbow'||b.special==='rainbow';
      grid[r][c]=a;grid[r2][c2]=b;a.r=r;a.c=c;b.r=r2;b.c=c2;
      if(ok)return {a,b};
    }
  }
  return null;
}

/* ---------------- 消除 ---------------- */
async function popTiles(set,combo){
  const arr=[...set];
  if(arr.length){
    const t=arr[0];
    floatText(t,`+${arr.length*10*combo}`,combo>1?`连击 ×${combo}`:'');
    beep(420+combo*90,.12,'triangle',.09);
  }
  arr.forEach((t,i)=>{
    t.el.classList.add('pop');
    setTimeout(()=>t.el.remove(),240);
    grid[t.r][t.c]=null;
  });
  await sleep(240);
}
function expand(set){
  let grew=true,guard=0;
  while(grew&&guard++<20){
    grew=false;
    for(const t of [...set]){
      if(!t.special)continue;
      const add=[];
      if(t.special==='bomb'){
        for(let r=t.r-1;r<=t.r+1;r++)for(let c=t.c-1;c<=t.c+1;c++)
          if(inB(r,c)&&grid[r][c])add.push(grid[r][c]);
      }else if(t.special==='rainbow'){
        for(let r=0;r<N;r++)for(let c=0;c<N;c++)
          if(grid[r][c]&&grid[r][c].type===t.type)add.push(grid[r][c]);
      }
      for(const x of add)if(!set.has(x)){set.add(x);grew=true;}
    }
  }
  return set;
}
async function gravity(){
  const fresh=[];
  for(let c=0;c<N;c++){
    let w=N-1;
    for(let r=N-1;r>=0;r--){
      const t=grid[r][c];
      if(t){if(r!==w){grid[w][c]=t;grid[r][c]=null;t.r=w;}w--;}
    }
    for(let r=w;r>=0;r--){
      const t=makeTile(TYPES[rnd(TYPES.length)],r,c,-(r+1)*CELL);
      grid[r][c]=t;fresh.push(t);
    }
  }
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c])place(grid[r][c]);
  await sleep(300);
}

/* ---------------- 交换主流程 ---------------- */
async function trySwap(a,b){
  if(busy)return;
  busy=true;clearHint();
  const ar=a.r,ac=a.c;
  grid[ar][ac]=b;grid[b.r][b.c]=a;
  [a.r,b.r]=[b.r,a.r];[a.c,b.c]=[b.c,a.c];
  place(a);place(b);beep(300,.06,'sine',.05);
  await sleep(210);

  const groups=findMatches();
  const rainbow=[a,b].find(t=>t.special==='rainbow');
  const other=rainbow===a?b:a;
  let clear=new Set();
  if(rainbow){
    clear.add(rainbow);
    if(other.special==='rainbow'){
      for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c])clear.add(grid[r][c]);
    }else{
      for(let r=0;r<N;r++)for(let c=0;c<N;c++)
        if(grid[r][c]&&grid[r][c].type===other.type)clear.add(grid[r][c]);
      if(other.special==='bomb')for(let r=other.r-1;r<=other.r+1;r++)
        for(let c=other.c-1;c<=other.c+1;c++)if(inB(r,c)&&grid[r][c])clear.add(grid[r][c]);
    }
  }
  for(const g of groups)for(const t of g.tiles)clear.add(t);

  if(!clear.size){
    // 无效交换，换回去
    grid[a.r][a.c]=b;grid[b.r][b.c]=a;
    [a.r,b.r]=[b.r,a.r];[a.c,b.c]=[b.c,a.c];
    place(a);place(b);beep(150,.1,'sawtooth',.05);
    await sleep(210);
    busy=false;return;
  }

  moves--;updateHUD();
  // 生成特殊棋子
  const spawns=[];
  for(const g of groups){
    if(g.tiles.length<4&&!(g.h&&g.v))continue;
    const kind=g.tiles.length>=5?'rainbow':'bomb';
    let seed=g.tiles.find(t=>t===a||t===b)||g.main[Math.floor(g.main.length/2)];
    spawns.push({tile:seed,kind,type:seed.type});
  }
  for(const s of spawns){clear.delete(s.tile);}

  await cascade(clear,spawns);

  // 死局则洗牌
  if(!findMove()){
    floatText(grid[N>>1][N>>1],'没有可消除的了','洗牌中…');
    await sleep(500);await shuffle();
  }
  busy=false;
  checkEnd();
  resetHint();
}

/** 连锁消除：clear 为初始待消除集合，spawns 为要升变的特殊棋子 */
async function cascade(clear,spawns){
  spawns=spawns||[];
  let combo=0;
  while(clear.size){
    combo++;
    expand(clear);
    score+=clear.size*10*combo;
    updateHUD();
    await popTiles(clear,combo);
    for(const s of spawns)if(s.tile.el.parentNode){setSpecial(s.tile,s.kind);s.tile.type=s.type;}
    spawns=[];
    await gravity();
    clear=new Set();
    for(const g of findMatches())for(const t of g.tiles)clear.add(t);
  }
}

async function shuffle(){
  const arr=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)arr.push(grid[r][c]);
  for(let k=0;k<300;k++){
    const types=arr.map(t=>t.type);
    for(let i=types.length-1;i>0;i--){const j=rnd(i+1);[types[i],types[j]]=[types[j],types[i]];}
    arr.forEach((t,i)=>{
      t.type=types[i];
      t.el.querySelector('.face').innerHTML=SVG[t.type];
      t.el.style.setProperty('--tint',TINT[t.type]);
      setSpecial(t,null);
    });
    if(!findMatches().length&&findMove())return;
  }
  // 极端情况：仍有匹配就直接消掉
  const m=findMatches();
  if(m.length){const s=new Set();for(const g of m)for(const t of g.tiles)s.add(t);await cascade(s,[]);}
}

/* ---------------- 提示 / 飘字 / HUD ---------------- */
function floatText(t,txt,sub){
  const d=document.createElement('div');
  d.className='float';
  d.innerHTML=txt+(sub?`<br><span style="font-size:11px">${sub}</span>`:'');
  d.style.left=(t.c*CELL)+'px';
  d.style.top=(t.r*CELL-6)+'px';
  d.style.width=CELL+'px';
  d.style.textAlign='center';
  boardEl.appendChild(d);
  setTimeout(()=>d.remove(),800);
}
function clearHint(){document.querySelectorAll('.tile.hint').forEach(e=>e.classList.remove('hint'));}
function resetHint(){
  clearTimeout(hintTimer);clearHint();
  hintTimer=setTimeout(()=>{
    if(busy)return;
    const m=findMove();if(!m)return;
    m.a.el.classList.add('hint');m.b.el.classList.add('hint');
  },7000);
}
function updateHUD(){
  document.getElementById('lvText').textContent=level;
  document.getElementById('scoreText').textContent=total+score;
  document.getElementById('movesText').textContent=moves;
  document.getElementById('goalText').textContent=`本关 ${score} / ${target}`;
  document.getElementById('bar').style.width=Math.min(100,score/target*100)+'%';
}
function checkEnd(){
  if(score>=target){
    const stars=moves>=15?3:moves>=7?2:1;
    showMask('过关啦！','⭐'.repeat(stars)+'☆'.repeat(3-stars),
      `第 ${level} 关完成，本关得分 ${score}，剩余 ${moves} 步。`,'下一关',()=>{
        total+=score;score=0;level++;moves=30;target+=600;
        updateHUD();resetHint();
      });
    beep(660,.12,'triangle',.08);setTimeout(()=>beep(880,.18,'triangle',.08),120);
  }else if(moves<=0){
    showMask('步数用完啦', '🐾🐾🐾',
      `本关得分 ${score}，还差 ${target-score} 分就过关了。`, '再来一次', ()=>{
        score=0;total=0;moves=30;target=1000;level=1;
        boardEl.innerHTML='';grid=Array.from({length:N},()=>Array(N).fill(null));
        fillFresh();layout();updateHUD();resetHint();
      });
    beep(200,.25,'sawtooth',.07);
  }
}
function showMask(title,stars,desc,btn,fn){
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mStars').textContent=stars;
  document.getElementById('mDesc').innerHTML=desc;
  const b=document.getElementById('mBtn');
  b.textContent=btn;b.onclick=()=>{document.getElementById('mask').classList.remove('show');fn();};
  document.getElementById('mask').classList.add('show');
}

/* ---------------- 输入 ---------------- */
function tileFrom(el){
  const e=el.closest('.tile');if(!e)return null;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]&&grid[r][c].el===e)return grid[r][c];
  return null;
}
function select(t){
  if(selected&&selected!==t)selected.el.classList.remove('sel');
  selected=t;t.el.classList.add('sel');
}
function deselect(){if(selected){selected.el.classList.remove('sel');selected=null;}}
function tap(t){
  if(!selected){select(t);return;}
  if(selected===t){deselect();return;}
  const near=Math.abs(selected.r-t.r)+Math.abs(selected.c-t.c)===1;
  if(near){const a=selected;deselect();trySwap(a,t);}
  else select(t);
}
boardEl.addEventListener('pointerdown',e=>{
  if(busy)return;
  const t=tileFrom(e.target);if(!t)return;
  drag={t,x:e.clientX,y:e.clientY,moved:false};
});
boardEl.addEventListener('pointermove',e=>{
  if(!drag||busy)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<CELL*0.45)return;
  const t=drag.t,target2=Math.abs(dx)>Math.abs(dy)
    ?(inB(t.r,t.c+(dx>0?1:-1))?grid[t.r][t.c+(dx>0?1:-1)]:null)
    :(inB(t.r+(dy>0?1:-1),t.c)?grid[t.r+(dy>0?1:-1)][t.c]:null);
  drag=null;deselect();
  if(target2)trySwap(t,target2);else tap(t);
});
boardEl.addEventListener('pointerup',e=>{
  if(!drag)return;
  const d=drag;drag=null;
  if(!d.moved)tap(d.t);
});
boardEl.addEventListener('pointercancel',()=>{drag=null;});

document.getElementById('restartBtn').onclick=()=>{newGame();resetHint();};
document.getElementById('soundBtn').onclick=e=>{
  soundOn=!soundOn;e.target.textContent=soundOn?'🔊':'🔇';if(soundOn)beep(600,.1);
};
window.addEventListener('resize',layout);

/* ---------------- 启动 ---------------- */
newGame();resetHint();
</script>
